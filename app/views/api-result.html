{% extends "layouts/main.html" %}

{% set pageName="API result" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <h1 class="govuk-heading-l">API result</h1>

    <p class="govuk-body">HTTP status: <strong>{{ data.apiStatus }}</strong></p>

    <pre class="govuk-body">{{ data.apiResult }}</pre>

    <p class="govuk-body">
      <a class="govuk-link" href="/api-test">Run again</a>
    </p>

  </div>
</div>

{% endblock %}
